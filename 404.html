<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 — Arda Mavi</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #000000;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to right, #1a3a7a, #7a1a1a);
      color: #f0ece4;
      padding: 2rem;
      padding: 20px 20px 80px 20px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
      flex: 1;
      justify-content: center;
    }

    .code {
      font-size: clamp(4rem, 20vw, 9rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      color: rgba(240, 236, 228, 0.12);
      line-height: 1;
      opacity: 0;
      animation: fadeUp 0.8s 0.05s forwards;
    }

    .subtitle {
      font-weight: 300;
      font-size: clamp(0.75rem, 3vw, 1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(240, 236, 228, 0.75);
      margin-top: -1rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.2s forwards;
    }

    .btn {
      width: 260px;
      text-align: center;
      padding: 0.8rem 2.6rem;
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      color: #ebebeb;
      border: 1px solid #ebebeb;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
      opacity: 0;
      animation: fadeUp 0.8s 0.5s forwards;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #1a1a2e;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    .btn:hover {
      border-color: transparent;
    }

    .btn:hover::after {
      opacity: 1;
    }

    footer {
      padding: 1.2rem;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      color: #999999;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main role="main">
    <p class="code">404</p>
    <p class="subtitle">Page not found</p>
    <a class="btn" href="https://ardamavi.com">
      <span>Go to Homepage</span>
    </a>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Arda Mavi. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>

</html>
